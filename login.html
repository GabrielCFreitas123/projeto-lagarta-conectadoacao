<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta no ConectaDoação">
    <title>Entrar - ConectaDoação</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>
<body>
    <header class="topo">
        <a class="logo" href="index.html">Conecta<span>Doação</span></a>
        <nav class="menu" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="como-funciona.html">Como funciona</a>
            <a href="locais.html">Locais</a>
            <a href="quero-doar.html">Quero doar</a>
            <a href="sobre.html">Sobre</a>
            <a class="menu-entrar" href="login.html" aria-current="page">Entrar</a>
        </nav>
    </header>

    <main class="pagina-login">
        <section class="login-card" aria-labelledby="titulo-login">
            <span class="login-icone" aria-hidden="true">👤</span>
            <header>
                <span class="categoria">Área do doador</span>
                <h1 id="titulo-login">Que bom ter você aqui!</h1>
                <p>Entre para continuar ajudando quem precisa.</p>
            </header>

            <form id="form-login">
                <div class="campo-login">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
                </div>

                <div class="campo-login">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" minlength="6" required>
                </div>

                <button class="botao botao-principal login-botao" type="submit">Entrar</button>
                <p id="mensagem-login" class="mensagem-login" role="status" aria-live="polite"></p>
            </form>

            <p class="login-ajuda">Ainda não tem uma conta? <a href="quero-doar.html">Comece uma doação</a></p>
        </section>
    </main>

    <footer class="rodape">
        <section class="container rodape-conteudo">
            <section>
                <strong>ConectaDoação</strong>
                <p>Desenvolvido por Gabriel Freitas — Matrícula: 10771415</p>
            </section>
            <p>© 2026 ConectaDoação</p>
        </section>
    </footer>
</body>
</html>
